<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 节点仓库配置面板</title>
<style>
  :root { --bg:#0f1115; --card:#1a1e26; --border:#2c3444; --text:#e6e9ef; --muted:#8b94a7; --accent:#4c8dff; --err:#f85149; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .box { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:36px 32px; width:340px; }
  .box h1 { font-size:18px; margin-bottom:6px; text-align:center; }
  .box .sub { color:var(--muted); font-size:13px; text-align:center; margin-bottom:24px; }
  .box input[type=password] { width:100%; background:#0d1016; color:var(--text); border:1px solid var(--border); border-radius:8px; padding:11px 12px; font-size:15px; outline:none; }
  .box input[type=password]:focus { border-color:var(--accent); }
  .box button { width:100%; background:var(--accent); border:none; border-radius:8px; padding:11px; margin-top:14px; color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
  .box button:hover { filter:brightness(1.1); }
  .err { color:var(--err); font-size:13px; margin-top:10px; text-align:center; }
  .tip { color:var(--muted); font-size:12px; margin-top:14px; text-align:center; }
</style>
</head>
<body>
<div class="box">
  <h1>🛠️ 节点仓库配置面板</h1>
  <div class="sub">请输入密码登录</div>
  <form method="post" action="/login">
    <input type="password" name="password" placeholder="密码" autofocus autocomplete="current-password">
    <button type="submit">登 录</button>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
  </form>
  <div class="tip">默认密码 admin，登录后可在面板内修改</div>
</div>
</body>
</html>
